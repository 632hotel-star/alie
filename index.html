<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060607" />
    <title>A.L.I.E. 2</title>
    <meta name="description" content="A.L.I.E. 2 is a persistent personal AI with memory. It acts on your device, runs your home, studies with you, builds with you and evolves." />
    <meta property="og:title" content="A.L.I.E. 2" />
    <meta property="og:description" content="Your AI. Always there. Always evolving." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060607'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ecece8'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>

    <header class="bar">
      <a class="mark" href="#hero" aria-label="A.L.I.E. 2">A.L.I.E. 2</a>
      <div class="tools">
        <button id="snd" type="button" aria-pressed="false" data-i18n="nav.sound.off">Sound off</button>
        <button id="lang" type="button" data-i18n="nav.lang">العربية</button>
      </div>
    </header>

    <main id="story">
      <!-- Particles: the wordmark itself is drawn by the particle system -->
      <section class="chapter" id="hero" style="--k: 1.45">
        <div class="stage hero">
          <h1 class="sr">A.L.I.E. 2</h1>
          <p class="tagline" data-i18n="hero.tag"></p>
        </div>
      </section>

      <section class="chapter" id="memory" style="--k: 3.5">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="memory.h"></h2>
            <p data-i18n="memory.p"></p>
            <div class="days">
              <ol>
                <li data-i18n="memory.d1"></li>
                <li data-i18n="memory.d2"></li>
                <li data-i18n="memory.d3"></li>
                <li data-i18n="memory.d4"></li>
              </ol>
              <i class="fill"></i>
              <p class="note"></p>
            </div>
            <p class="claim scrub" data-i18n="claim.memory"></p>
          </div>
        </div>
      </section>

      <section class="chapter" id="evolve" style="--k: 2.6">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="evolve.h"></h2>
            <p data-i18n="evolve.p"></p>
            <div class="say"><span class="typed" data-say="evolve.say"></span><i class="caret"></i></div>
            <p class="status"></p>
          </div>
        </div>
      </section>

      <section class="chapter" id="control" style="--k: 2.9">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="control.h"></h2>
            <p data-i18n="control.p"></p>
            <div class="say"><span class="typed" data-say="control.say"></span><i class="caret"></i></div>
            <ol class="steps">
              <li data-i18n="step.1"></li>
              <li data-i18n="step.2"></li>
              <li data-i18n="step.3"></li>
              <li data-i18n="step.4"></li>
              <li data-i18n="step.5"></li>
            </ol>
            <p class="claim scrub" data-i18n="claim.device"></p>
          </div>
        </div>
      </section>

      <section class="chapter" id="home" style="--k: 2.8">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="home.h"></h2>
            <p data-i18n="home.p"></p>
            <div class="say"><span class="typed" data-say="home.say"></span><i class="caret"></i></div>
            <ul class="devs">
              <li data-i18n="dev.1"></li>
              <li data-i18n="dev.2"></li>
              <li data-i18n="dev.3"></li>
              <li data-i18n="dev.4"></li>
              <li data-i18n="dev.5"></li>
              <li data-i18n="dev.6"></li>
            </ul>
            <p class="claim scrub" data-i18n="claim.home"></p>
          </div>
        </div>
      </section>

      <section class="chapter" id="study" style="--k: 4.3">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="study.h"></h2>
            <p data-i18n="study.p"></p>
            <ol class="outs">
              <li data-i18n="out.1"></li>
              <li data-i18n="out.2"></li>
              <li data-i18n="out.3"></li>
              <li data-i18n="out.4"></li>
              <li data-i18n="out.5"></li>
            </ol>
          </div>
        </div>
      </section>

      <section class="chapter" id="create" style="--k: 5.4">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="create.h"></h2>
            <p data-i18n="create.p"></p>
            <ul class="types">
              <li data-i18n="type.1"></li>
              <li data-i18n="type.2"></li>
              <li data-i18n="type.3"></li>
              <li data-i18n="type.4"></li>
              <li data-i18n="type.5"></li>
              <li data-i18n="type.6"></li>
            </ul>
            <div class="say"><span class="typed" data-say="create.say1"></span><i class="caret"></i></div>
            <p class="claim scrub" data-i18n="claim.build"></p>
          </div>
        </div>
      </section>

      <section class="chapter" id="agent" style="--k: 2.8">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="agent.h"></h2>
            <p data-i18n="agent.p"></p>
            <div class="say"><span class="typed" data-say="agent.say"></span><i class="caret"></i></div>
            <p class="state"></p>
          </div>
          <span class="anchor" data-i18n="orbit.1"></span>
          <span class="anchor" data-i18n="orbit.2"></span>
          <span class="anchor" data-i18n="orbit.3"></span>
          <span class="anchor" data-i18n="orbit.4"></span>
          <span class="anchor" data-i18n="orbit.5"></span>
          <span class="anchor" data-i18n="orbit.6"></span>
        </div>
      </section>

      <section class="chapter" id="seek" style="--k: 5.8">
        <div class="stage seek">
          <div class="seektop">
            <ul class="mon">
              <li data-i18n="mon.1"></li>
              <li data-i18n="mon.2"></li>
              <li data-i18n="mon.3"></li>
              <li data-i18n="mon.4"></li>
              <li data-i18n="mon.5"></li>
            </ul>
            <p class="newcap scrub" data-i18n="seek.new"></p>
          </div>
          <div class="seekmsg">
            <p class="nrf scrub" data-i18n="seek.nrf"></p>
            <p class="because scrub" data-i18n="seek.because"></p>
            <p class="nothing scrub" data-i18n="seek.nothing"></p>
          </div>
          <div class="ex">
            <p class="say"><span class="typed"></span><i class="caret"></i></p>
            <p class="say"><span class="typed"></span><i class="caret"></i></p>
            <p class="say"><span class="typed"></span><i class="caret"></i></p>
            <p class="say"><span class="typed"></span><i class="caret"></i></p>
          </div>
        </div>
      </section>

      <section class="chapter" id="creative" style="--k: 3.2">
        <div class="stage side">
          <div class="copy">
            <h2 data-i18n="creative.h"></h2>
            <p data-i18n="creative.p"></p>
            <ul class="kinds">
              <li data-i18n="kind.1"></li>
              <li data-i18n="kind.2"></li>
              <li data-i18n="kind.3"></li>
            </ul>
            <p class="claim scrub" data-i18n="claim.create"></p>
          </div>
        </div>
      </section>

      <section class="chapter" id="iface" style="--k: 4">
        <div class="stage mid">
          <div class="copy wide">
            <h2><span data-i18n="iface.h1"></span> <span class="soft" data-i18n="iface.h2"></span></h2>
          </div>
          <p class="state-label" aria-live="polite"></p>
        </div>
      </section>

      <section class="chapter" id="meet" style="--k: 3.1">
        <div class="stage side">
          <div class="copy">
            <h2 class="scrub" data-i18n="meet.h"></h2>
            <ul class="nots">
              <li class="scrub" data-i18n="meet.1"></li>
              <li class="scrub" data-i18n="meet.2"></li>
              <li class="scrub" data-i18n="meet.3"></li>
            </ul>
          </div>
        </div>
      </section>

      <section class="chapter" id="one" style="--k: 4">
        <div class="stage mid">
          <span class="anchor" data-i18n="node.1"></span>
          <span class="anchor" data-i18n="node.2"></span>
          <span class="anchor" data-i18n="node.3"></span>
          <span class="anchor" data-i18n="node.4"></span>
          <span class="anchor" data-i18n="node.5"></span>
          <span class="anchor" data-i18n="node.6"></span>
          <span class="anchor" data-i18n="node.7"></span>
          <span class="anchor" data-i18n="node.8"></span>
          <span class="anchor" data-i18n="node.9"></span>
          <span class="anchor" data-i18n="node.10"></span>
          <p class="connected" data-i18n="one.connected"></p>
        </div>
      </section>

      <section class="chapter flow" id="before">
        <div class="before">
          <h2 data-i18n="before.h"></h2>
          <dl>
            <div><dt data-i18n="before.1.h"></dt><dd data-i18n="before.1.p"></dd></div>
            <div><dt data-i18n="before.2.h"></dt><dd data-i18n="before.2.p"></dd></div>
            <div><dt data-i18n="before.3.h"></dt><dd data-i18n="before.3.p"></dd></div>
            <div><dt data-i18n="before.4.h"></dt><dd data-i18n="before.4.p"></dd></div>
            <div><dt data-i18n="before.5.h"></dt><dd data-i18n="before.5.p"></dd></div>
          </dl>
        </div>
      </section>

      <section class="chapter" id="all" style="--k: 4.7">
        <div class="stage allstage">
          <span class="cap" data-i18n="cap.1"></span>
          <span class="cap" data-i18n="cap.2"></span>
          <span class="cap" data-i18n="cap.3"></span>
          <span class="cap" data-i18n="cap.4"></span>
          <span class="cap" data-i18n="cap.5"></span>
          <ul class="five">
              <li data-i18n="five.1"></li>
              <li data-i18n="five.2"></li>
              <li data-i18n="five.3"></li>
          </ul>
        </div>
      </section>

      <section class="chapter" id="end" style="--k: 2.5">
        <div class="stage endstage">
          <div class="endcopy">
            <p class="endmark" lang="en" dir="ltr">A.L.I.E. 2</p>
            <p class="endsub"><span data-i18n="end.s1"></span><span data-i18n="end.s2"></span></p>
            <ul class="lines">
              <li data-i18n="end.l1"></li>
              <li data-i18n="end.l2"></li>
              <li data-i18n="end.l3"></li>
              <li data-i18n="end.l4"></li>
            </ul>
            <a class="cta" href="#hero"><span data-i18n="end.cta"></span></a>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
